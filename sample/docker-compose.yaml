services:
  formatter:
    image: ghcr.io/schema-lens/formatter:latest
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:8000:8000'
    networks:
      - backend
    pids_limit: 64
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:?Set BACKEND_NETWORK to the network containing ui and api}
